name: Publish Provider Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use while publishing the package (e.g. v1.0.0-alpha.1)"
        default: ''
        required: false
      go-version:
        description: 'Go version to use if building needs to be done'
        default: '1.27'
        required: false

jobs:
  publish-provider-package:
    permissions:
      contents: read
      packages: write
    uses: crossplane-contrib/provider-workflows/.github/workflows/publish-provider.yml@d8bb2978c8987635b2fddb5bd9c2868bd14117b0 # main
    with:
      repository: provider-vultr
      registry_org: vultr
      version: ${{ github.event.inputs.version }}
      go-version: ${{ github.event.inputs.go-version }}
      cleanup-disk: true
    secrets:
      GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
      XPKG_MIRROR_TOKEN: ${{ secrets.XPKG_MIRROR_TOKEN }}
      XPKG_MIRROR_ACCESS_ID: ${{ secrets.XPKG_MIRROR_ACCESS_ID }}

  push-docker-hub:
    needs: publish-provider-package
    if: github.event.inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Setup crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Package to Docker Hub
        run: |
          crane copy ghcr.io/vultr/provider-vultr:${{ github.event.inputs.version }} docker.io/vultr/provider-vultr:${{ github.event.inputs.version }} --allow-nondistributable-artifacts
