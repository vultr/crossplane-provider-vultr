apiVersion: compute.vultr.upbound.io/v1alpha1
kind: InstanceIPv4
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1alpha1/instanceipv4
  labels:
    testing.upbound.io/example-name: my_instance_ipv4
  name: my-instance-ipv4
spec:
  forProvider:
    instanceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: my_instance
    reboot: false

---

apiVersion: compute.vultr.upbound.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1alpha1/instanceipv4
  labels:
    testing.upbound.io/example-name: my_instance
  name: my-instance
spec:
  forProvider:
    enableIpv6: true
    osId: 167
    plan: vc2-1c-1gb
    region: ewr
