apiVersion: dns.vultr.upbound.io/v1alpha1
kind: Record
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1alpha1/record
  labels:
    testing.upbound.io/example-name: my_record
  name: my-record
spec:
  forProvider:
    data: 66.42.94.227
    domainSelector:
      matchLabels:
        testing.upbound.io/example-name: my_domain
    name: www
    type: A

---

apiVersion: dns.vultr.upbound.io/v1alpha1
kind: Domain
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1alpha1/record
  labels:
    testing.upbound.io/example-name: my_domain
  name: my-domain
spec:
  forProvider:
    domain: domain.com
    ip: 66.42.94.227
