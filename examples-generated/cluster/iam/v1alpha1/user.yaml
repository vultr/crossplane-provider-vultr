apiVersion: iam.vultr.upbound.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1alpha1/user
  labels:
    testing.upbound.io/example-name: my_user
  name: my-user
spec:
  forProvider:
    apiEnabled: true
    email: user@vultr.com
    name: my user
    passwordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
