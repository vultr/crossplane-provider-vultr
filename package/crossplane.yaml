apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-vultr
  annotations:
    meta.crossplane.io/source: github.com/vultr/crossplane-provider-vultr
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Crossplane provider to manage Vultr resources in Kubernetes.
    meta.crossplane.io/readme: |
      Provider Vultr is a Crossplane provider for [Vultr](https://www.vultr.com/),
      generated with [Upjet](https://github.com/crossplane/upjet) from the
      Vultr Terraform provider. See
      https://github.com/vultr/crossplane-provider-vultr for the list of
      managed resources and configuration.
    friendly-name.meta.crossplane.io: Provider Vultr
spec:
  crossplane:
    version: ">=v1.14.0-0"
  capabilities:
    - SafeStart
